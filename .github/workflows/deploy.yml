name: Deploy to VPS

on:
  push:
    branches: [ master, tanstack-migration ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: |
          npm run test:salud
          npm run test:habitos
          npm run test:gfit
          npm run test:brain-write
          npm run test:sueno
          npm run test:contenido
          npm run test:radar
          npm run test:mcp
          npm run test:auth

  deploy:
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf "%s" "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/pancho_deploy
          chmod 600 ~/.ssh/pancho_deploy
          ssh-keyscan -H 178.105.163.120 >> ~/.ssh/known_hosts
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Deploy to VPS
        run: |
          ssh -i ~/.ssh/pancho_deploy root@178.105.163.120 "cd /opt/pancho-os && ( [ -d .git ] || ( git init && git remote add origin https://github.com/franciscoabad-founder/pancho-os.git ) ) && git fetch origin && git reset --hard origin/master && git clean -fd && npm install && npm run build && (NODE_ENV=production pm2 restart pancho-os --update-env || NODE_ENV=production pm2 start scripts/start-prod.mjs --name pancho-os) && pm2 save"

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/pancho_deploy root@178.105.163.120 "curl -fsS http://localhost:4322/ > /dev/null"
