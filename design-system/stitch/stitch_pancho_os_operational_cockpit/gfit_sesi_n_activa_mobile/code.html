<style>
        body {
            background-color: #0E1738; /* bg-ink */
            color: #FAFAF7; /* text-linen */
        }
        
        /* Rest Timer Circle Animation */
        .timer-circle {
            transition: stroke-dashoffset 1s linear;
        }
    </style>

<body class="bg-ink min-h-screen flex flex-col font-body-lg antialiased overflow-hidden selection:bg-ultramarine selection:text-linen">
<!-- Intent implies transactional/focus mode (Active Session). Suppressing standard navigation shell to prioritize canvas as per mandate. -->
<!-- Top Progress Bar -->
<div class="w-full h-2 bg-royal/30 absolute top-0 left-0 z-50">
<div class="h-full bg-ultramarine w-[45%] transition-all duration-500 ease-out"></div>
</div>
<!-- Main Canvas -->
<main class="flex-1 flex flex-col px-margin pt-xl pb-margin h-full w-full max-w-md mx-auto">
<!-- Header / Context -->
<header class="flex justify-between items-start mb-lg">
<div>
<p class="font-label-eyebrow text-label-eyebrow text-champagne uppercase tracking-widest mb-xs">Serie 2 de 3</p>
<h1 class="font-headline-lg text-headline-lg text-linen">Press de Banca</h1>
</div>
<button aria-label="Pause/Menu" class="text-on-surface-variant hover:text-linen transition-colors p-sm">
<span class="material-symbols-outlined text-[32px]">more_vert</span>
</button>
</header>
<!-- Big Inputs for Sweaty Fingers -->
<section class="grid grid-cols-2 gap-md mb-xl flex-shrink-0">
<!-- Weight Input -->
<div class="bg-royal rounded-xl p-md flex flex-col items-center justify-center relative overflow-hidden border border-outline-variant/30">
<label class="font-label-eyebrow text-label-eyebrow text-on-surface-variant mb-sm uppercase">Peso (kg)</label>
<div class="flex items-center justify-between w-full">
<button class="w-12 h-12 bg-surface-variant rounded-lg flex items-center justify-center text-linen active:bg-ultramarine transition-colors text-headline-md font-headline-md">−</button>
<span class="font-hero-metric text-hero-metric text-champagne">85</span>
<button class="w-12 h-12 bg-surface-variant rounded-lg flex items-center justify-center text-linen active:bg-ultramarine transition-colors text-headline-md font-headline-md">+</button>
</div>
</div>
<!-- Reps Input -->
<div class="bg-royal rounded-xl p-md flex flex-col items-center justify-center relative overflow-hidden border border-outline-variant/30">
<label class="font-label-eyebrow text-label-eyebrow text-on-surface-variant mb-sm uppercase">Reps</label>
<div class="flex items-center justify-between w-full">
<button class="w-12 h-12 bg-surface-variant rounded-lg flex items-center justify-center text-linen active:bg-ultramarine transition-colors text-headline-md font-headline-md">−</button>
<span class="font-hero-metric text-hero-metric text-champagne">8</span>
<button class="w-12 h-12 bg-surface-variant rounded-lg flex items-center justify-center text-linen active:bg-ultramarine transition-colors text-headline-md font-headline-md">+</button>
</div>
</div>
</section>
<!-- Rest Timer (High Contrast / Enormous) -->
<section class="flex-1 flex flex-col items-center justify-center mb-xl">
<div class="relative w-64 h-64 flex items-center justify-center">
<!-- SVG Circle for Timer -->
<svg class="absolute inset-0 w-full h-full -rotate-90 transform" viewbox="0 0 100 100">
<circle class="opacity-30" cx="50" cy="50" fill="none" r="45" stroke="#1A2B6B" stroke-width="4"></circle>
<circle class="timer-circle" cx="50" cy="50" fill="none" r="45" stroke="#3B4ED9" stroke-dasharray="283" stroke-dashoffset="60" stroke-width="4"></circle>
</svg>
<div class="text-center z-10 flex flex-col items-center">
<span class="font-label-eyebrow text-label-eyebrow text-on-surface-variant mb-2">DESCANSO</span>
<span class="font-hero-metric text-hero-metric text-linen tracking-tighter" style="font-size: 80px; line-height: 80px;">1:15</span>
</div>
</div>
</section>
<!-- Full Width Action Button -->
<div class="mt-auto pb-sm">
<button class="w-full bg-ultramarine text-linen font-headline-md text-headline-md py-4 rounded-xl flex items-center justify-center gap-sm active:scale-[0.98] transition-transform">
<span>Completar Serie</span>
<span class="material-symbols-outlined" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
</div>
</main>
