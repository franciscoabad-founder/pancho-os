[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dev-dependencies]

[dependencies]
# reqwest ya entra en el arbol como dependencia de tauri. Se declara explicito
# para poder usarlo desde flow.rs. default-features = false a proposito: solo
# hablamos con servicios locales por http, no hace falta arrastrar TLS.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-notification = "2.3.3"
tokio = { version = "1", features = ["rt", "macros", "process", "fs", "time"] }
