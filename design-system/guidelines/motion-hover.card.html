<div style="height:160px;background:#FAFAF7;display:flex;align-items:center;gap:20px;padding:0 24px;font-family:Montserrat,Arial,sans-serif">

<div style="font-size:12px;color:#6B7280;line-height:1.5;max-width:340px">Transitions: 120–200ms, ease-standard. No bounce, no glow, no scale-on-press. Press states darken slightly toward Royal/Bronze.</div>
</div>
